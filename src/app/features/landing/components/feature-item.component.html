<div class = "container-feature-item">
    <div class = "icon-container">
        <img class="feature__icon"
            [src]="iconSrc()"
            [alt]="iconAlt()"
            width="28"
            height="28" 
       />

    </div>
    <div class = "text-container">
        <h3 class="text-heading feature-item__title">{{title()}}</h3>
        <p class="text-body-secondary feature-item__description">{{description()}}</p>
    </div>
</div>
