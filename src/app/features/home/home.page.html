<!-- Home composes independent live sections while canonical cards own Preview and favorite behavior. -->
<main class="home-page">
  <header class="home-welcome">
    <div class="home-page__container home-welcome__inner">
      @if (username$ | async; as username) {
        <h1 class="text-section-title">Welcome back, {{ username }}!</h1>
      } @else {
        <h1 class="text-section-title">Welcome back!</h1>
      }
      <p class="text-lead">What are we cooking today?</p>
      <div class="home-welcome__search">
        <app-recipe-search-bar (searchSubmitted)="onSearchSubmitted($event)" />
      </div>
    </div>
  </header>

  <div class="home-page__container home-content">
    <app-recipe-list-section
      title="Discover"
      [recipes]="discoverRecipes()"
      [loading]="isDiscoverLoading()"
      [errorMessage]="discoverError()"
      [emptyMessage]="isDiscoverLoaded() ? 'No compatible recipes are available right now.' : null"
      (actionTriggered)="onDiscoverViewAll()"
      (retryRequested)="retryDiscover()"
    />

    @if (
      isFavoritesLoading()
      || favoritesError()
      || (isFavoritesLoaded() && favoriteRecipes().length > 0)
    ) {
      <app-recipe-list-section
        title="Your Favorite Recipes"
        [recipes]="favoriteRecipes()"
        [loading]="isFavoritesLoading()"
        [errorMessage]="favoritesError()"
        [actionDisabled]="!favoritesRouteAvailable"
        (actionTriggered)="onFavoritesViewAll()"
        (retryRequested)="retryFavorites()"
      />
    }

    <!-- Manual Meal Planning will replace this onboarding with the same shared section,
         mapping at most four returned recipe projections when its owning contract lands. -->
    <app-meal-plan-empty-state
      [actionDisabled]="!mealPlanRouteAvailable"
      (actionTriggered)="onMealPlanAction()"
    />

    <section class="home-explore" aria-labelledby="home-explore-title">
      <h2 id="home-explore-title" class="text-subtitle">Looking for something else?</h2>
      <button
        type="button"
        class="btn-selection text-button home-explore__action"
        (click)="onExploreRecipes()"
      >
        Explore All Recipes
        <mat-icon aria-hidden="true">arrow_forward</mat-icon>
      </button>
    </section>
  </div>
</main>
