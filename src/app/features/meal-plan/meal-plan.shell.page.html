<section class="meal-plan-shell">
  <div class="meal-plan-shell__page">
    <header class="meal-plan-shell__header">
      <span class="meal-plan-shell__eyebrow">{{ heading }}</span>
      <div class="meal-plan-shell__progress">
        <div class="meal-plan-shell__bar" [class.is-active]="currentIndex >= 0"></div>
        <div class="meal-plan-shell__bar" [class.is-active]="currentIndex >= 1"></div>
        <div class="meal-plan-shell__bar" [class.is-active]="currentIndex >= 2"></div>
        <div class="meal-plan-shell__bar" [class.is-active]="currentIndex >= 3"></div>
      </div>
      <h4>Step {{ currentIndex + 1 }} of 4</h4>
    </header>

    <main class="meal-plan-shell__card">
      <div class="meal-plan-shell__content">
        <h2>{{ title }}</h2>
        <p>{{ subTitle }}</p>

        @if (errorMessage(); as errorMessage) {
          <div class="text-error meal-plan-shell__error" role="alert">{{ errorMessage }}</div>
        }

        <router-outlet></router-outlet>
      </div>

      <footer class="meal-plan-shell__footer">
        <button
          type="button"
          class="btn-link-secondary meal-plan-shell__button"
          [class.is-hidden]="!canGoBack"
          [disabled]="!canGoBack"
          (click)="goBack()"
        >
          Back
        </button>

        <button
          type="button"
          class="btn-link--primary meal-plan-shell__button"
          [class.is-hidden]="!showNext"
          [disabled]="!canGoNext"
          (click)="goNext()"
        >
          Next
        </button>

        <button
          type="button"
          class="btn-link--primary meal-plan-shell__button"
          [class.is-hidden]="!isLast"
          [disabled]="!wizard.hasSelectedMeals() || wizard.isRecalculating()"
          (click)="saveMealPlan()"
        >
          Save Meal Prep
        </button>
      </footer>
    </main>

    <div class="meal-plan-shell__backlink">
      <a [routerLink]="['/meal-plan']">← Back to Meal Prep Dashboard</a>
    </div>
  </div>
</section>
