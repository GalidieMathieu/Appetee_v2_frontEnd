<nav class="week-strip" aria-label="Selected week">@for(day of dates();track day.date) {<button type="button" class="btn-selection text-label" [class.is-selected]="day.date === selected()" [attr.aria-pressed]="day.date === selected()" [attr.aria-label]="day.date + ', ' + (day.savedMealCount === null ? 'not loaded' : day.savedMealCount + ' saved meals')" (click)="selectDate.emit(day.date)"><span class="weekday text-label">{{ day.date | date:'EEE' }}</span><strong class="text-heading">{{ day.date | date:'d' }}</strong><span class="text-small">{{ day.savedMealCount ?? 'Unknown' }} meals · {{ day.caloriesKcal ?? 'Unknown' }} kcal</span></button>}</nav>
